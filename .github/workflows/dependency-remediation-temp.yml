name: Dependency Remediation Temp

on:
  push:
    branches:
      - feature/bravhas-homologation-production-readiness

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/bravhas-homologation-production-readiness
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update only blocking dependencies
        run: |
          npm install next@16.3.5 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update js-yaml sharp --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify dependency audit before commit
        run: node scripts/dependency-audit.mjs
      - name: Commit dependency-only result and remove temporary workflow
        run: |
          git config user.name "BravSystems Dependency Remediation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/dependency-remediation-temp.yml
          git add package.json package-lock.json
          git diff --cached --stat
          git commit -m "fix(security): remediate blocking dependency advisories"
          git push origin HEAD:feature/bravhas-homologation-production-readiness
