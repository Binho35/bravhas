name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/hrdp-foundation

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bravhas
  DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bravhas
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bravhas_shadow
  BRAVHAS_DEV_AUTH_BYPASS: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bravhas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bravhas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npm run seed

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
