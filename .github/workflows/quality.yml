name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/hrdp-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bravhas
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bravhas
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bravhas_shadow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
