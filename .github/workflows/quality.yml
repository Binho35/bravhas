name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/hrdp-foundation

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bravhas
  DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bravhas
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bravhas_shadow
  BRAVHAS_DEV_AUTH_BYPASS: "false"
  BRAVHAS_ENV: TEST

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bravhas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bravhas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: node scripts/dependency-audit.mjs
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: Migration safety
        run: |
          if grep -R 'db push --accept-data[-]loss' --exclude-dir=.agents --exclude-dir=.claude --exclude-dir=.windsurf --exclude-dir=node_modules --exclude='*.md' . | grep -q .; then
            echo "Forbidden destructive Prisma db push found"
            exit 1
          fi
          if grep -R 'migrate[[:space:]]reset' --exclude-dir=.agents --exclude-dir=.claude --exclude-dir=.windsurf --exclude-dir=node_modules --exclude='*.md' . | grep -q .; then
            echo "Forbidden destructive Prisma migration command found"
            exit 1
          fi
      - name: Security regression
        run: |
          ! grep -R "BRAVHAS_DEV_AUTH_BYPASS.*true" app modules lib --include='*.ts' --include='*.tsx'
          ! grep -R "localStorage" modules/auth modules/financial modules/obligations app --include='*.ts' --include='*.tsx'
          ! grep -R "npx --yes tsx" package.json .github scripts prisma --include='*.json' --include='*.yml' --include='*.yaml' --include='*.ts'
          ! grep -R -E '\$(queryRawUnsafe|executeRawUnsafe)' app modules scripts --include='*.ts' --include='*.tsx'
          grep -q 'createHash("sha256")' modules/auth/server/session.ts
          grep -q 'httpOnly: true' modules/auth/server/session.ts
          grep -q 'sameSite: "lax"' modules/auth/server/session.ts
          grep -q 'secure: process.env.NODE_ENV === "production"' modules/auth/server/session.ts
          grep -q 'getServerAuthSession' app/api/auth/session/route.ts
          grep -q 'SESSION_COOKIE_NAME' proxy.ts
          grep -q 'Seed recusado em ambiente de produção' prisma/seed.ts
          grep -q 'E2E seed recusado fora de TEST/HOMOLOGATION' scripts/e2e-seed.ts
          grep -q 'PRODUCTION_RESTORE_FORBIDDEN' scripts/restore-database.mjs
          grep -q 'LOCAL_FORBIDDEN_IN_PRODUCTION' scripts/production-preflight.mjs
      - name: Repository readiness regression
        run: node scripts/repository-readiness-check.mjs
      - name: Unit security contracts
        run: npm run test:unit
      - name: Operational safety contracts
        run: npm run test:contracts
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed
        run: npm run seed
      - name: Data integrity
        run: npm run test:integrity
      - name: Functional integration workflows
        run: npm run test:integration
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  fresh-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bravhas_fresh
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bravhas_fresh"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/bravhas_fresh
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5433/bravhas_fresh
      BRAVHAS_DEV_AUTH_BYPASS: "false"
      BRAVHAS_ENV: TEST
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      - name: Fresh migration baseline
        run: npx prisma migrate deploy
      - name: Fresh seed
        run: npm run seed
      - name: Migration status
        run: npx prisma migrate status

  backup-restore-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bravhas_recovery_source
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bravhas_recovery_source"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_source
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_source
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_shadow
      BRAVHAS_DEV_AUTH_BYPASS: "false"
      BRAVHAS_ENV: TEST
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: PostgreSQL recovery tools
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
      - name: Prisma generate
        run: npx prisma generate
      - name: Source migrations
        run: npx prisma migrate deploy
      - name: Synthetic recovery data
        run: |
          npm run e2e:seed
          npm run recovery:fixture
      - name: Source data integrity
        run: npm run test:integrity
      - name: Backup source database
        run: |
          rm -rf .bravhas/recovery
          mkdir -p .bravhas/recovery
          npm run backup:execute -- --output-dir=.bravhas/recovery
          dump="$(find .bravhas/recovery -maxdepth 1 -type f -name '*.dump' -print -quit)"
          test -n "$dump"
          test -f "$dump.manifest.json"
          echo "RECOVERY_DUMP=$dump" >> "$GITHUB_ENV"
      - name: Create isolated restore database
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host=localhost --port=5434 --username=postgres --dbname=postgres
          --set=ON_ERROR_STOP=1 --command='CREATE DATABASE bravhas_recovery_restore'
      - name: Restore into isolated database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_restore
          DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_restore
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_shadow
          BRAVHAS_RESTORE_ALLOWED: "true"
        run: npm run restore:execute -- --artifact="$RECOVERY_DUMP"
      - name: Post-restore data integrity
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_restore
          DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_restore
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_shadow
        run: npm run test:integrity
      - name: Post-restore critical records
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_restore
          DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_restore
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/bravhas_recovery_shadow
        run: npm run recovery:verify

  browser-security-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bravhas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bravhas_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bravhas_e2e
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bravhas_e2e
      BRAVHAS_DEV_AUTH_BYPASS: "false"
      BRAVHAS_ENV: TEST
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Synthetic E2E fixtures
        run: npm run e2e:seed
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated E2E
        run: npm run test:e2e:auth
      - name: Cross-tenant and RBAC negative E2E
        run: npm run test:e2e:security
      - name: Functional workflow golden path
        run: npm run test:e2e:functional
      - name: Desktop consolidated product smoke
        run: npm run test:e2e:desktop
      - name: Mobile product smoke
        run: npm run test:e2e:mobile
