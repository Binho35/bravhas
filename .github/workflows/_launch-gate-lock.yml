name: Launch Gate dependency lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: launch-gate-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
